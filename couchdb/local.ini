; Mounted into /opt/couchdb/etc/local.d/ — merged over default config.
; CORS for browser-based clients (e.g. PouchDB replication).
; Access to databases is guarded by admin credentials (basic auth).
[cors]
origins = *
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE

[couchdb]
single_node = true

[httpd]
bind_address = 0.0.0.0

[chttpd]
bind_address = 0.0.0.0