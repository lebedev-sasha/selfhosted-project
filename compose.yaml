name: selfhosted

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LOGSEQ_DOMAIN: ${LOGSEQ_DOMAIN}
      SYNC_DOMAIN: ${SYNC_DOMAIN}
      VIKUNJA_DOMAIN: ${VIKUNJA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  logseq-sync:
    image: ghcr.io/yshalsager/logseq-selfhost-sync:20261003-ec05499
    restart: unless-stopped
    environment:
      DB_SYNC_PORT: ${DB_SYNC_PORT}
      DB_SYNC_BASE_URL: ${DB_SYNC_BASE_URL}
      DB_SYNC_DATA_DIR: ${DB_SYNC_DATA_DIR}
      DB_SYNC_STORAGE_DRIVER: ${DB_SYNC_STORAGE_DRIVER}
      DB_SYNC_ASSETS_DRIVER: ${DB_SYNC_ASSETS_DRIVER}
      DB_SYNC_LOG_LEVEL: ${DB_SYNC_LOG_LEVEL}
      DB_SYNC_ADMIN_TOKEN: ${DB_SYNC_ADMIN_TOKEN}
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_JWKS_URL: ${COGNITO_JWKS_URL}
    volumes:
      - sync_data:/app/data
  logseq-webapp:
    image: ghcr.io/yshalsager/logseq-selfhost-web:20261003-b517311
    restart: unless-stopped
  vikunja:
    image: vikunja/vikunja:latest
    restart: unless-stopped
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://${VIKUNJA_DOMAIN}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_SERVICE_JWTSECRET}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: ${VIKUNJA_SERVICE_ENABLEREGISTRATION}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VIKUNJA_DATABASE_DATABASE: vikunja
    volumes:
      - vikunja_files:/app/vikunja/files
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vikunja
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vikunja -d vikunja" ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  caddy_data:
  caddy_config:
  pg_data:
  vikunja_files:
  sync_data:
