name: selfhosted

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - logseq-sync
      - logseq-webapp
      - vikunja
  logseq-sync:
    image: ghcr.io/yshalsager/logseq-selfhost-sync:20261003-ec05499
    container_name: logseq-sync
    restart: unless-stopped
    env_file: .env
    volumes:
      - sync_data:/app/data
  logseq-webapp:
    image: ghcr.io/yshalsager/logseq-selfhost-web:20261003-b517311
    container_name: logseq-web
    restart: unless-stopped
  vikunja:
    image: vikunja/vikunja:latest
    restart: unless-stopped
    container_name: vikunja_container
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://${VIKUNJA_DOMAIN}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_SERVICE_JWTSECRET}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: ${VIKUNJA_SERVICE_ENABLEREGISTRATION}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VIKUNJA_DATABASE_DATABASE: vikunja
    volumes:
      - vikunja_files:/app/vikunja/files
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vikunja
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vikunja -d vikunja" ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  caddy_data:
  caddy_config:
  pg_data:
  vikunja_files:
  sync_data:
